
name: Build Down.io APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q develop-downio-android-app.zip -d extracted

          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew bulunamadi!"
            exit 1
          fi

          ANDROID_DIR=$(dirname "$GRADLEW")
          echo "ANDROID_DIR=$ANDROID_DIR" >> $GITHUB_ENV

          PROPERTIES="$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ ! -f "$PROPERTIES" ]; then
            echo "gradle-wrapper.properties bulunamadi!"
            exit 1
          fi

          URL=$(grep '^distributionUrl=' "$PROPERTIES" | cut -d= -f2- | sed 's/\\:/:/g')
          echo "GRADLE_URL=$URL" >> $GITHUB_ENV

      - name: Install Gradle
        run: |
          wget -q "$GRADLE_URL" -O gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP/gradle"
          GRADLE=$(find "$RUNNER_TEMP/gradle" -type f -path '*/bin/gradle' | head -n 1)
          echo "GRADLE=$GRADLE" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"
          "$GRADLE" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Downio-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
